[package]
name = "cakevpn-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs the CakeVPN tunnel with the rights it needs"

[lib]
name = "cakevpn_helper"
path = "src/lib.rs"

[[bin]]
name = "cakevpn-helper"
path = "src/main.rs"

[dependencies]
cakevpn-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "signal"] }
netdev = "0.36"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Memory",
] }
