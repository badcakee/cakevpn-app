name: Build CakeVPN

# Run it from the Actions tab ("Run workflow"), or push a tag like v1.3.0.
# Each run makes a GitHub release named after the version in
# src-tauri/tauri.conf.json: a draft while Windows, Mac and Android build,
# published once all three are in it. The apps check the newest published
# release for updates.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Set the repository variable CAKEVPN_API to your panel's app address,
  # e.g. https://vpn.example.com:2096. Without it the app uses the default in src-tauri/src/api.rs.
  CAKEVPN_API: ${{ vars.CAKEVPN_API }}
  # Signs the update files so the apps only install updates made here.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the helper service
        run: |
          cargo build --release -p cakevpn-helper --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/cakevpn-helper.exe src-tauri/binaries/cakevpn-helper-x86_64-pc-windows-msvc.exe
      - run: scripts/fetch-sing-box.sh x86_64-pc-windows-msvc
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CakeVPN __VERSION__
          releaseBody: Download CakeVPN for Windows (.exe), Mac (.dmg) or Android (.apk) below. Installed apps update themselves.
          # A draft until both platforms are in it (see the last step), so apps
          # never find a release that lacks their platform.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis

  macos:
    # After Windows, so the two jobs don't overwrite each other's part of latest.json.
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the helper for Apple Silicon and Intel
        run: |
          cargo build --release -p cakevpn-helper --target aarch64-apple-darwin
          cargo build --release -p cakevpn-helper --target x86_64-apple-darwin
          lipo -create -output src-tauri/binaries/cakevpn-helper-universal-apple-darwin \
            target/aarch64-apple-darwin/release/cakevpn-helper target/x86_64-apple-darwin/release/cakevpn-helper
          # Tauri builds each architecture first and checks for its own copy too.
          cp target/aarch64-apple-darwin/release/cakevpn-helper src-tauri/binaries/cakevpn-helper-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/cakevpn-helper src-tauri/binaries/cakevpn-helper-x86_64-apple-darwin
          # Unsigned code must at least be ad-hoc signed to run on Apple Silicon.
          for f in src-tauri/binaries/cakevpn-helper-*-apple-darwin; do codesign --force --sign - "$f"; done
      - run: scripts/fetch-sing-box.sh universal-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CakeVPN __VERSION__
          releaseBody: Download CakeVPN for Windows (.exe), Mac (.dmg) or Android (.apk) below. Installed apps update themselves.
          # A draft until both platforms are in it (see the last step), so apps
          # never find a release that lacks their platform.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg

  android:
    # After Windows, which makes the draft release the APK goes into.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: scripts/fetch-sing-box.sh android arm64-v8a
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cakevpn.jks"
          export CAKEVPN_KEYSTORE="$RUNNER_TEMP/cakevpn.jks" CAKEVPN_KEY_ALIAS=cakevpn
          export CAKEVPN_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" CAKEVPN_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          npx tauri android build --apk --target aarch64
          rm -f "$RUNNER_TEMP/cakevpn.jks"
      - name: Add the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk="CakeVPN_${version}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          gh release upload "v$version" "$apk" --clobber

  publish:
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release now that Windows, Mac and Android are all in it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v$version" --draft=false --latest
